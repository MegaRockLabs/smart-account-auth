[dev-dependencies]
smart-account-auth  = { workspace = true, default-features = false, features = [
    "cosmwasm", "curves",  "utils",  "types", "cosmos_arb_addr", "ethereum", "passkeys", "replay", "cosmos_arb", "native"
]}
saa-common          = { workspace = true }

[package]
name                = "saa-schema"
description         = "Macros and serialization utlities for various blockchain based virtual machines"
edition             = { workspace = true }
authors             = { workspace = true }
license             = { workspace = true }
repository          = { workspace = true }
version             = { workspace = true }

[dependencies]
saa-proto-core      = { workspace = true  }
saa-proto-wasm      = { workspace = true, optional = true }
saa-proto-cosmwasm  = { workspace = true, optional = true }
saa-proto-substrate = { workspace = true, optional = true }
saa-proto-solana    = { workspace = true, optional = true }


# Substrate
scale               = { workspace = true, optional = true }
scale-info          = { workspace = true, optional = true }
# CosmWasm
cw-schema           = { workspace = true, optional = true }
cosmwasm-schema     = { workspace = true, optional = true }
serde               = { workspace = true, optional = true } 
# Solana
borsh               = { workspace = true, optional = true }

thiserror           = { workspace = true }
strum_macros        = { workspace = true }
strum               = { workspace = true }



[features]
default        = [
    "std"
]
solana         = [
    "dep:borsh",
    "saa-proto-solana",
]
substrate      = [
    "dep:scale", 
    "dep:scale-info",
    "saa-proto-substrate",
]
cosmwasm       = [
    "wasm",
    "saa-proto-cosmwasm", 
]
wasm           = [
    "dep:serde", 
    "dep:cosmwasm-schema", 
    "dep:cw-schema",
    "saa-proto-wasm", 
    "std"     
]
std            = [
    "scale?/std", 
    "scale-info?/std"
]